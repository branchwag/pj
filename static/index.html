<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pj - An AI Chatbot</title>
    <style>
      @font-face {
        font-family: 'Special Elite';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/SpecialElite.ttf) format('truetype');
        unicode-range:
          U+0000-00FF,
          U+0100-024F,
          U+1E00-1EFF,
          U+2000-206F,
          U+20A0-20CF;
      }

      @font-face {
        font-family: 'Noto Sans CJK SC Local';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/NotoSansCJKsc-Regular.otf) format('opentype');
      }
    </style>
    <style>
      :root {
        --font-latin: "Special Elite";
        --font-cjk: "Noto Sans CJK SC Local",
          "Noto Sans CJK SC",
          "Noto Sans SC",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          "WenQuanYi Micro Hei",
          sans-serif;
        --font-ui: var(--font-latin), var(--font-cjk);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-cjk);
        background-color: #0a0a0a;
        color: #ededed;
        height: 100vh;
        display: flex;
      }

      .sidebar {
        width: 280px;
        min-width: 280px;
        background-color: #111;
        border-right: 1px solid #222;
        display: flex;
        flex-direction: column;
        height: 100vh;
        transition: width 0.2s ease, min-width 0.2s ease;
      }

      .sidebar.collapsed {
        width: 0;
        min-width: 0;
        overflow: hidden;
        border-right: none;
      }

      .toggle-sidebar {
        background: #111;
        border: 1px solid #222;
        border-right: none;
        color: #6b7280;
        cursor: pointer;
        font-size: 0.65rem;
        padding: 0;
        width: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, background-color 0.15s;
        z-index: 5;
        border-radius: 0;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .toggle-sidebar:hover {
        color: #ededed;
        background-color: #1a1a1a;
      }

      .sidebar-header {
        padding: 1rem;
        border-bottom: 1px solid #222;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .sidebar-header h2 {
        font-family: var(--font-ui);
        font-size: 1.1rem;
        white-space: nowrap;
      }

      .sidebar-header button {
        padding: 0.4rem 0.75rem;
        font-size: 0.85rem;
        white-space: nowrap;
      }

      .chat-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .chat-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 0.75rem;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: background-color 0.15s;
        user-select: none;
      }

      .chat-item:hover {
        background-color: #1a1a1a;
      }

      .chat-item.active {
        background-color: #1f2937;
      }

      .chat-title {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.9rem;
      }

      .chat-status {
        flex-shrink: 0;
        font-size: 0.72rem;
        color: #fbbf24;
        white-space: nowrap;
      }

      .delete-btn {
        background: none;
        border: none;
        color: #6b7280;
        cursor: pointer;
        font-size: 1.1rem;
        padding: 0.1rem 0.3rem;
        border-radius: 0.25rem;
        line-height: 1;
        opacity: 0;
        transition: opacity 0.15s, color 0.15s;
      }

      .chat-item:hover .delete-btn {
        opacity: 1;
      }

      .delete-btn:hover {
        color: #ef4444;
        background-color: rgba(239, 68, 68, 0.1);
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-width: 0;
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #222;
        font-family: var(--font-ui);
        font-size: 1.25rem;
      }

      .chat-header-left {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .message {
        padding: 1rem;
        border-radius: 0.5rem;
        max-width: 80%;
        word-wrap: break-word;
        white-space: pre-wrap;
        font-family: var(--font-ui);
      }

      .message.user {
        background-color: #f3f4f6;
        color: #000;
        margin-left: auto;
        margin-right: 0;
      }

      .message.assistant {
        background-color: #1f2937;
        color: #fff;
        margin-right: auto;
        margin-left: 0;
      }

      .message.loading {
        background-color: #374151;
        color: #9ca3af;
        margin-right: auto;
      }

      .message.tool,
      .message.toolcall {
        background-color: transparent;
        color: #6b7280;
        font-family: monospace;
        font-size: 0.8rem;
        max-width: 90%;
        padding: 0.15rem 1rem;
      }

      .empty-state {
        margin: auto;
        text-align: center;
        color: #6b7280;
        font-size: 1.1rem;
      }

      .input-container {
        display: flex;
        gap: 0.5rem;
        padding: 1rem;
        border-top: 1px solid #222;
      }

      input[type="text"] {
        flex: 1;
        padding: 0.75rem;
        border: 1px solid #374151;
        border-radius: 0.375rem;
        font-family: inherit;
        font-size: 1rem;
        background-color: #fff;
        color: #000;
      }

      button {
        padding: 0.75rem 1.5rem;
        background-color: #1f2937;
        color: white;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 1rem;
        transition: background-color 0.2s;
      }

      button:hover:not(:disabled) {
        background-color: #374151;
      }

      button:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }

      /* Tool call modal */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.visible {
        display: flex;
      }

      .modal {
        background-color: #1f2937;
        border: 1px solid #374151;
        border-radius: 0.5rem;
        padding: 1.5rem;
        max-width: 600px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
      }

      .modal h3 {
        margin-bottom: 1rem;
        color: #fbbf24;
        font-size: 1.1rem;
      }

      .tool-call-item {
        background-color: #111;
        border: 1px solid #374151;
        border-radius: 0.375rem;
        padding: 0.75rem;
        margin-bottom: 0.75rem;
        font-size: 0.85rem;
      }

      .tool-call-name {
        color: #60a5fa;
        font-weight: bold;
        margin-bottom: 0.25rem;
      }

      .tool-call-detail {
        color: #d1d5db;
        white-space: pre-wrap;
        word-break: break-all;
        font-family: var(--font-cjk);
      }

      .modal-buttons {
        display: flex;
        gap: 0.75rem;
        justify-content: flex-end;
        margin-top: 1rem;
      }

      .btn-confirm {
        background-color: #2563eb;
      }

      .btn-confirm:hover {
        background-color: #3b82f6;
      }

      .btn-deny {
        background-color: #dc2626;
      }

      .btn-deny:hover {
        background-color: #ef4444;
      }

      .save-btn {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.35rem 0.75rem;
        font-size: 0.8rem;
        background-color: #2563eb;
        color: #fff;
        border: none;
        border-radius: 0.25rem;
        cursor: pointer;
        font-family: inherit;
      }

      button,
      input[type="text"],
      .chat-title,
      .message,
      .empty-state {
        font-family: var(--font-cjk);
      }
      .save-btn:hover {
        background-color: #3b82f6;
      }
      .save-btn.saved {
        background-color: #16a34a;
        cursor: default;
      }

      .message pre {
        background-color: #111;
        border: 1px solid #333;
        border-radius: 0.375rem;
        padding: 0.75rem;
        margin: 0.5rem 0;
        overflow-x: auto;
      }

      .message code {
        font-size: 0.9rem;
      }

      @media (max-width: 640px) {
        .sidebar {
          width: 200px;
          min-width: 200px;
        }
        .message {
          max-width: 90%;
        }
        .modal {
          max-width: 95%;
        }
      }

      .input-container {
        flex-direction: column;
        gap: 0;
        padding: 0.5rem 1rem 1rem 1rem;
      }

      .input-row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      .image-preview-bar {
        display: flex;
        gap: 0.5rem;
        padding: 0.4rem 0;
        overflow-x: auto;
        min-height: 0;
      }

      .image-preview-bar:empty {
        display: none;
      }

      .image-preview-item {
        position: relative;
        flex-shrink: 0;
      }

      .image-preview-item img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 0.375rem;
        border: 1px solid #374151;
      }

      .image-preview-item .remove-img {
        position: absolute;
        top: -4px;
        right: -4px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #dc2626;
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 0.7rem;
        line-height: 18px;
        text-align: center;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .attach-btn {
        background: none;
        border: 1px solid #374151;
        color: #9ca3af;
        cursor: pointer;
        font-size: 1.2rem;
        padding: 0.5rem 0.6rem;
        border-radius: 0.375rem;
        transition: color 0.15s, border-color 0.15s;
        flex-shrink: 0;
      }

      .attach-btn:hover {
        color: #ededed;
        border-color: #6b7280;
      }

      .chat-container.drag-over {
        outline: 2px dashed #60a5fa;
        outline-offset: -4px;
        background-color: rgba(96, 165, 250, 0.05);
      }

      .message img.chat-image {
        max-width: 300px;
        max-height: 300px;
        border-radius: 0.375rem;
        margin-bottom: 0.5rem;
        display: block;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Chats</h2>
        <button id="newChatBtn">+ New</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </aside>
    <button id="toggleSidebar" class="toggle-sidebar" title="Collapse sidebar">◀</button>

    <main class="main-content">
      <div class="chat-header">
        <div class="chat-header-left">
          <span>pj</span>
        </div>
        <input
          type="text"
          id="workdirInput"
          placeholder="Folder for new files (e.g. /home/you/project)"
          autocomplete="off"
          spellcheck="false"
          style="flex:1;margin-left:1rem;max-width:420px;padding:0.35rem 0.6rem;font-size:0.85rem;border:1px solid #3f3f46;border-radius:6px;background:#18181b;color:#d4d4d8;"
          title="Where the agent creates and edits files for this chat. Leave empty to use pj's own directory."
        />
      </div>
      <div class="chat-container" id="chatContainer">
        <div class="empty-state" id="emptyState">Select a chat or create a new one</div>
      </div>
      <div class="input-container">
        <div class="image-preview-bar" id="imagePreviewBar"></div>
        <div class="input-row">
          <input type="file" id="imageFileInput" accept="image/*" multiple hidden />
          <button class="attach-btn" id="attachBtn" title="Attach image">+</button>
          <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
            autocomplete="off"
          />
          <button id="sendButton">Send</button>
        </div>
      </div>
    </main>

    <!-- Tool confirmation modal -->
    <div class="modal-overlay" id="toolModal">
      <div class="modal">
        <h3>🔧 The agent wants to take these actions</h3>
        <p style="margin:0.2rem 0 0.6rem;font-size:0.85rem;color:#9ca3af;">Nothing happens until you confirm. Read-only lookups are safe to approve.</p>
        <div id="toolCallsList"></div>
        <div class="modal-buttons">
          <button class="btn-deny" id="denyBtn">Deny</button>
          <button class="btn-confirm" id="confirmBtn">Confirm</button>
        </div>
      </div>
    </div>

    <script>
      const chatList = document.getElementById("chatList");
      const chatContainer = document.getElementById("chatContainer");
      const emptyState = document.getElementById("emptyState");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const newChatBtn = document.getElementById("newChatBtn");

      const toolModal = document.getElementById("toolModal");
      const toolCallsList = document.getElementById("toolCallsList");
      const confirmBtn = document.getElementById("confirmBtn");
      const denyBtn = document.getElementById("denyBtn");

      let isLoading = false;
      let loadingChatId = null;
      let activeChatId = null;
      let chats = [];
      let pendingToolCalls = [];

      let pendingChatId = null;

      const filesWrittenByTools = new Set();
      let sharedActivityByChat = {};
      let chatEventSource = null;
      let lastChatEventAt = 0;
      let lastChatRefreshAt = 0;
      let lastKnownChatIds = new Set();
      let chatRefreshInFlight = null;
      let pendingImages = [];

      const CHAT_EVENT_STALE_MS = 20000;
      const CHAT_RECONNECT_CHECK_MS = 5000;
      const CHAT_DISCONNECTED_POLL_MS = 3000;
      const CHAT_REMOTE_ACTIVITY_POLL_MS = 4000;
      const CHAT_VISIBLE_STALE_POLL_MS = 30000;
      const CHAT_REFRESH_COOLDOWN_MS = 2000;

      function getSharedActivityState(chatId) {
        if (chatId === null || chatId === undefined) return "idle";
        return sharedActivityByChat[chatId] || "idle";
      }

      function getActiveChatActivityState() {
        if (pendingToolCalls.length > 0 && pendingChatId === activeChatId) {
          return "awaiting_tool_confirmation";
        }
        if (isLoading && loadingChatId !== null && loadingChatId === activeChatId) {
          return "thinking";
        }
        return getSharedActivityState(activeChatId);
      }

      function isActiveChatLoading() {
        return getActiveChatActivityState() === "thinking";
      }

      function syncComposerState() {
        const activity = getActiveChatActivityState();
        const awaitingToolDecision = activity === "awaiting_tool_confirmation";
        const thinking = activity === "thinking";
        sendButton.disabled = isLoading || thinking;
        messageInput.disabled = awaitingToolDecision || thinking;
      }

      function clearPendingStateForChat(chatId) {
        if (pendingChatId === chatId) {
          pendingToolCalls = [];
          pendingChatId = null;
        }
      }

      function formatTime(dateStr) {
        const d = new Date(dateStr + "Z");
        return d.toLocaleString();
      }

      function renderChatList() {
        chatList.innerHTML = "";
        for (const chat of chats) {
          const div = document.createElement("div");
          div.className = "chat-item" + (chat.id === activeChatId ? " active" : "");
          div.dataset.id = chat.id;

          const title = document.createElement("span");
          title.className = "chat-title";
          title.textContent = chat.title;

          const sharedActivity = getSharedActivityState(chat.id);
          const status = document.createElement("span");
          status.className = "chat-status";
          if (sharedActivity === "thinking") {
            status.textContent = "Thinking...";
          } else if (sharedActivity === "awaiting_tool_confirmation") {
            status.textContent = "Awaiting confirm";
          }

          const del = document.createElement("button");
          del.className = "delete-btn";
          del.textContent = "\u00d7";
          del.title = "Delete chat";
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteChat(chat.id);
          });

          div.appendChild(title);
          if (status.textContent) {
            div.appendChild(status);
          }
          div.appendChild(del);
          div.addEventListener("click", () => selectChat(chat.id));
          chatList.appendChild(div);
        }
      }

      function extractCodeBlocks(text) {
        const blocks = [];
        const re = /```(\w*)\n([\s\S]*?)```/g;
        let match;
        while ((match = re.exec(text)) !== null) {
          blocks.push({ language: match[1], code: match[2] });
        }
        return blocks;
      }

      function suggestSavePath(ext) {
        const chat = chats.find((c) => c.id === activeChatId);
        if (chat && chat.workdir) return chat.workdir.replace(/\/+$/, "") + "/script." + ext;
        return "/tmp/script." + ext;
      }

      async function saveCodeBlock(code, filename) {
        try {
          const res = await fetch("/api/write-file", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ path: filename, content: code }),
          });
        const data = await res.json();
        if (res.ok) return "Saved: " + (data.path || filename);
        else return "Error: " + (data.error || "save failed");
        } catch (e) {
          return "Error: " + e.message;
        }
      }

      function addMessage(content, role, images) {
        removeEmptyState();
        const messageDiv = document.createElement("div");
        messageDiv.className = "message " + role;

        if (images && images.length > 0) {
          for (const b64 of images) {
            const img = document.createElement("img");
            img.className = "chat-image";
            img.src = "data:image/png;base64," + b64;
            img.addEventListener("click", () => {
              window.open(img.src, "_blank");
            });
            messageDiv.appendChild(img);
          }
        }

        const codeBlockRe = /```(\w*)\n([\s\S]*?)```/g;
        let lastIndex = 0;
        let match;
        while ((match = codeBlockRe.exec(content)) !== null) {
          if (match.index > lastIndex) {
            messageDiv.appendChild(document.createTextNode(content.slice(lastIndex, match.index)));
          }
          const lang = match[1];
          const code = match[2];
          const pre = document.createElement("pre");
          const codeEl = document.createElement("code");
          if (lang) codeEl.className = "language-" + lang;
          codeEl.textContent = code;
          pre.appendChild(codeEl);
          messageDiv.appendChild(pre);
          lastIndex = match.index + match[0].length;
        }
        if (lastIndex < content.length) {
          messageDiv.appendChild(document.createTextNode(content.slice(lastIndex)));
        }
        if (!messageDiv.hasChildNodes() && content) {
          messageDiv.textContent = content;
        }

        chatContainer.appendChild(messageDiv);

        if (role === "assistant") {
          const blocks = extractCodeBlocks(content);
          for (const block of blocks) {
            if (!block.code.trim()) continue;
            const lang = block.language || "script";
            const extMap = { python: "py", javascript: "js", typescript: "ts", bash: "sh", shell: "sh", ruby: "rb", go: "go", golang: "go", rust: "rs", "c++": "cpp" };
            const ext = extMap[block.language] || block.language || "sh";
            const alreadyWritten = [...filesWrittenByTools].some((p) => p.toLowerCase().endsWith("." + String(ext).toLowerCase()));
            if (alreadyWritten) continue;
            const btn = document.createElement("button");
            btn.className = "save-btn";
            btn.textContent = "Save " + lang;
            btn.addEventListener("click", async () => {
              const name = prompt("Save as:", suggestSavePath(ext));
              if (!name) return;
              btn.textContent = "Saving...";
              btn.disabled = true;
              const result = await saveCodeBlock(block.code, name);
              btn.textContent = result;
              if (result.startsWith("Saved")) btn.classList.add("saved");
              btn.disabled = false;
            });
            chatContainer.appendChild(btn);
          }
        }

        chatContainer.scrollTop = chatContainer.scrollHeight;
        return messageDiv;
      }

      function addLoadingMessage(text = "Thinking...") {
        let loadingDiv = document.getElementById("loadingMessage");
        if (!loadingDiv) {
          loadingDiv = document.createElement("div");
          loadingDiv.className = "message loading";
          loadingDiv.id = "loadingMessage";
          chatContainer.appendChild(loadingDiv);
        }
        loadingDiv.textContent = text;
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return loadingDiv;
      }

      function renderSharedActivity() {
        const activity = getActiveChatActivityState();
        if (activity === "thinking") {
          addLoadingMessage("Thinking...");
        } else if (activity === "awaiting_tool_confirmation" && pendingChatId !== activeChatId) {
          addLoadingMessage("Awaiting tool confirmation in another client...");
        } else {
          document.getElementById("loadingMessage")?.remove();
        }
      }

      function describeToolCall(tc) {
        const args = tc.function.arguments || {};
        if (tc.function.name === "write_file") return "Overwrite or create the file " + (args.path || "?") + " with new content (" + ((args.content || "").length) + " bytes)";
        if (tc.function.name === "edit_file") return "Edit " + (args.path || "?") + ": replace a unique snippet of text";
        if (tc.function.name === "read_file") return "Read the file " + (args.path || "?") + " (read-only)";
        if (tc.function.name === "run_command") return "Run this command in the project directory: " + (args.command || "?");
        if (tc.function.name === "glob") return "List file names matching \"" + (args.pattern || "?") + "\" — just finds files, reads nothing, changes nothing (read-only)";
        if (tc.function.name === "grep") return "Search inside files for '" + (args.pattern || "?") + "' under " + (args.path || ".") + " (read-only)";
        if (tc.function.name === "read_directory") return "List what is inside the directory " + (args.path || "?") + " (read-only)";
        return tc.function.name;
      }

      async function fetchAndShowPendingTools(chatId) {
        try {
          const res = await fetch("/api/chats/" + chatId + "/pending-tools", { cache: "no-store" });
          if (!res.ok) return;
          const data = await res.json();
          if (data.tool_calls && data.tool_calls.length > 0 && activeChatId === chatId) {
            showToolModal(data.tool_calls, chatId);
            syncComposerState();
          }
        } catch (e) {
          console.error("Failed to fetch pending tools:", e);
        }
      }

      async function renderMessagesForChat(id) {
        const res = await fetch("/api/chats/" + id + "/messages", { cache: "no-store" });
        const messages = await res.json();
        chatContainer.innerHTML = "";
        filesWrittenByTools.clear();
        for (const msg of messages) {
          if (msg.role === "tool") {
            const div = document.createElement("div");
            div.className = "message tool";
            div.textContent = "  [" + (msg.name || "tool") + "] " + (msg.content || "").split("\n")[0].substring(0, 160);
            chatContainer.appendChild(div);
          } else {
            if (msg.tool_calls) {
              for (const tc of msg.tool_calls) {
                if (tc.function.name === "write_file" && tc.function.arguments && tc.function.arguments.path) {
                  filesWrittenByTools.add(tc.function.arguments.path);
                }
              }
            }
            addMessage(msg.content, msg.role, msg.images);
            if (msg.tool_calls) {
              for (const tc of msg.tool_calls) {
                const div = document.createElement("div");
                div.className = "message toolcall";
                div.textContent = "  -> " + describeToolCall(tc);
                chatContainer.appendChild(div);
              }
            }
          }
        }
        if (messages.length === 0 && getActiveChatActivityState() === "idle") {
          showEmptyState();
        }
        renderSharedActivity();
        if (
          pendingToolCalls.length > 0 &&
          pendingChatId === id &&
          !isLoading
        ) {
          showToolModal(pendingToolCalls, id);
        } else {
          toolModal.classList.remove("visible");
        }
        return messages;
      }

      function removeEmptyState() {
        const es = document.getElementById("emptyState");
        if (es) es.remove();
      }

      function showEmptyState() {
        chatContainer.innerHTML =
          '<div class="empty-state" id="emptyState">Select a chat or create a new one</div>';
      }

      function renderImagePreviews() {
        const bar = document.getElementById("imagePreviewBar");
        bar.innerHTML = "";
        for (let i = 0; i < pendingImages.length; i++) {
          const item = document.createElement("div");
          item.className = "image-preview-item";
          const img = document.createElement("img");
          img.src = "data:image/png;base64," + pendingImages[i];
          const btn = document.createElement("button");
          btn.className = "remove-img";
          btn.textContent = "\u00d7";
          btn.addEventListener("click", () => {
            pendingImages.splice(i, 1);
            renderImagePreviews();
          });
          item.appendChild(img);
          item.appendChild(btn);
          bar.appendChild(item);
        }
      }

      function addPendingImageFromBlob(blob) {
        if (!blob.type.startsWith("image/")) return;
        if (blob.size > 10 * 1024 * 1024) return;
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(",")[1];
          if (base64) {
            pendingImages.push(base64);
            renderImagePreviews();
          }
        };
        reader.readAsDataURL(blob);
      }

      async function loadChats() {
        try {
          const res = await fetch("/api/chats", { cache: "no-store" });
          chats = await res.json();
          lastKnownChatIds = new Set(chats.map((c) => c.id));
          lastChatRefreshAt = Date.now();
          renderChatList();
        } catch (e) {
          console.error("Failed to load chats:", e);
        }
      }

      async function refreshChatsWithFallback() {
        if (chatRefreshInFlight) {
          return chatRefreshInFlight;
        }

        const refreshPromise = (async () => {
          const previousIds = new Set(chats.map((c) => c.id));
          await loadChats();
          const newChat = chats.find((c) => !previousIds.has(c.id));
          if (newChat && activeChatId === null) {
            await selectChat(newChat.id);
            return;
          }
          if (activeChatId !== null && chats.some((c) => c.id === activeChatId)) {
            renderSharedActivity();
          }
        })();

        chatRefreshInFlight = refreshPromise;
        try {
          await refreshPromise;
        } finally {
          if (chatRefreshInFlight === refreshPromise) {
            chatRefreshInFlight = null;
          }
        }
      }

      function hasSharedRemoteActivity() {
        return (
          pendingChatId !== null ||
          Object.keys(sharedActivityByChat).length > 0
        );
      }

      function shouldRunFallbackRefresh() {
        if (document.visibilityState !== "visible") {
          return false;
        }

        const now = Date.now();
        if (chatRefreshInFlight || now - lastChatRefreshAt < CHAT_REFRESH_COOLDOWN_MS) {
          return false;
        }

        const sseHealthy =
          chatEventSource && now - lastChatEventAt <= CHAT_EVENT_STALE_MS;

        if (!chatEventSource || !sseHealthy) {
          return now - lastChatRefreshAt >= CHAT_DISCONNECTED_POLL_MS;
        }

        if (hasSharedRemoteActivity()) {
          return now - lastChatRefreshAt >= CHAT_REMOTE_ACTIVITY_POLL_MS;
        }

        return now - lastChatRefreshAt >= CHAT_VISIBLE_STALE_POLL_MS;
      }

      function maybeRefreshChatsWithFallback() {
        if (!shouldRunFallbackRefresh()) {
          return;
        }
        refreshChatsWithFallback().catch((e) => {
          console.error("Fallback chat refresh failed:", e);
        });
      }

      async function selectChat(id) {
        activeChatId = id;
        toolModal.classList.remove("visible");
        pendingImages = [];
        renderImagePreviews();
        renderChatList();
        chatContainer.innerHTML = "";
        syncComposerState();
        const chat = chats.find((c) => c.id === id);
        workdirInput.value = (chat && chat.workdir) || "";
        messageInput.focus();

        try {
          await renderMessagesForChat(id);
        } catch (e) {
          console.error("Failed to load messages:", e);
          showEmptyState();
        }
      }

      async function deleteChat(id) {
        try {
          const res = await fetch("/api/chats/" + id, { method: "DELETE" });
          if (!res.ok) {
            console.error("Failed to delete chat:", res.status, await res.text());
            return;
          }
          chats = chats.filter((c) => c.id !== id);
          if (activeChatId === id) {
            clearPendingStateForChat(id);
            activeChatId = null;
            chatContainer.innerHTML = "";
            showEmptyState();
          }
          renderChatList();
          syncComposerState();
        } catch (e) {
          console.error("Failed to delete chat:", e);
        }
      }

      async function createNewChat() {
        try {
          const res = await fetch("/api/chats", { method: "POST" });
          const chat = await res.json();
          chats.unshift(chat);
          renderChatList();
          await selectChat(chat.id);
        } catch (e) {
          console.error("Failed to create chat:", e);
        }
      }

      function connectChatEvents() {
        if (chatEventSource) {
          chatEventSource.close();
        }

        const eventSource = new EventSource("/api/events");
        chatEventSource = eventSource;
        lastChatEventAt = Date.now();

        eventSource.onopen = () => {
          lastChatEventAt = Date.now();
        };

        eventSource.onmessage = async (event) => {
          try {
            lastChatEventAt = Date.now();
            const change = JSON.parse(event.data);
            const knownChatIds = new Set(chats.map((c) => c.id));
            const changedChatId =
              change.Upsert?.id ??
              change.Deleted?.id ??
              change.Activity?.id ??
              null;
            if (change.Deleted && activeChatId === change.Deleted.id) {
              clearPendingStateForChat(change.Deleted.id);
              delete sharedActivityByChat[change.Deleted.id];
              activeChatId = null;
              chatContainer.innerHTML = "";
              showEmptyState();
            }
            if (change.Activity) {
              const chatId = change.Activity.id;
              const state = change.Activity.state;
              if (state === "Idle") {
                delete sharedActivityByChat[chatId];
                if (chatId === activeChatId && pendingChatId === chatId) {
                  pendingToolCalls = [];
                  pendingChatId = null;
                }
              } else if (state === "Thinking") {
                sharedActivityByChat[chatId] = "thinking";
              } else if (state === "AwaitingToolConfirmation") {
                sharedActivityByChat[chatId] = "awaiting_tool_confirmation";
                if (activeChatId === chatId && pendingToolCalls.length === 0) {
                  await fetchAndShowPendingTools(chatId);
                }
              }
            }
            await refreshChatsWithFallback();
            const isNewRemoteChat =
              change.Upsert &&
              changedChatId !== null &&
              !knownChatIds.has(changedChatId) &&
              chats.some((c) => c.id === changedChatId);
            if (isNewRemoteChat) {
              await selectChat(changedChatId);
              syncComposerState();
              return;
            }
            if (
              activeChatId === null &&
              changedChatId !== null &&
              !change.Deleted &&
              chats.some((c) => c.id === changedChatId)
            ) {
              activeChatId = changedChatId;
              renderChatList();
              await renderMessagesForChat(activeChatId);
              syncComposerState();
              return;
            }
            if (
              activeChatId !== null &&
              ((change.Upsert && change.Upsert.id === activeChatId) ||
               (change.Activity && change.Activity.id === activeChatId))
            ) {
              await renderMessagesForChat(activeChatId);
            } else {
              renderSharedActivity();
            }
            syncComposerState();
          } catch (e) {
            console.error("Failed to handle chat event:", e);
          }
        };

        eventSource.addEventListener("connected", () => {
          lastChatEventAt = Date.now();
        });

        eventSource.addEventListener("ping", () => {
          lastChatEventAt = Date.now();
        });

        eventSource.onerror = () => {
          eventSource.close();
          if (chatEventSource === eventSource) {
            chatEventSource = null;
          }
          setTimeout(connectChatEvents, 2000);
        };
      }

      setInterval(() => {
        if (!chatEventSource || Date.now() - lastChatEventAt > CHAT_EVENT_STALE_MS) {
          connectChatEvents();
        }
      }, CHAT_RECONNECT_CHECK_MS);

      setInterval(() => {
        maybeRefreshChatsWithFallback();
      }, 1000);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          maybeRefreshChatsWithFallback();
        }
      });

      function updateChatTitle(id, title) {
        const chat = chats.find((c) => c.id === id);
        if (chat && chat.title === "New Chat") {
          chat.title = title;
          renderChatList();
        }
      }

      function showToolModal(toolCalls, chatId = activeChatId) {
        pendingToolCalls = toolCalls;
        pendingChatId = chatId;
        toolCallsList.innerHTML = "";

        for (const tc of toolCalls) {
          const div = document.createElement("div");
          div.className = "tool-call-item";

          const nameDiv = document.createElement("div");
          nameDiv.className = "tool-call-name";
          const toolLabels = {
            glob: "glob — find files by name pattern",
            grep: "grep — search inside files",
            read_file: "read_file — view a file",
            read_directory: "read_directory — list a folder",
            write_file: "write_file — create/overwrite a file",
            edit_file: "edit_file — modify a file",
            run_command: "run_command — execute a shell command",
          };
          nameDiv.textContent = toolLabels[tc.function.name] || tc.function.name;

          const detailDiv = document.createElement("div");
          detailDiv.className = "tool-call-detail";
          const args = tc.function.arguments || {};

          if (tc.function.name === "write_file") {
            const sizeText = document.createElement("div");
            sizeText.textContent = describeToolCall(tc);
            const previewText = document.createElement("pre");
            previewText.style.marginTop = "0.3rem";
            previewText.style.fontSize = "0.8rem";
            previewText.style.maxHeight = "8rem";
            previewText.style.overflow = "auto";
            previewText.textContent = (args.content || "").substring(0, 800) + ((args.content || "").length > 800 ? "\n..." : "");
            detailDiv.appendChild(sizeText);
            detailDiv.appendChild(previewText);
          } else if (tc.function.name === "edit_file") {
            const oldPre = document.createElement("pre");
            oldPre.style.cssText = "margin:0.3rem 0;font-size:0.8rem;max-height:6rem;overflow:auto;white-space:pre-wrap;";
            oldPre.textContent = "- " + (args.old_string || "");
            const newPre = document.createElement("pre");
            newPre.style.cssText = "margin:0;font-size:0.8rem;max-height:6rem;overflow:auto;white-space:pre-wrap;color:#9ca3af;";
            newPre.textContent = "+ " + (args.new_string || "");
            const pLabel = document.createElement("div");
            pLabel.textContent = args.path || "?";
            detailDiv.appendChild(pLabel);
            detailDiv.appendChild(oldPre);
            detailDiv.appendChild(newPre);
          } else {
            detailDiv.textContent = describeToolCall(tc);
          }

          div.appendChild(nameDiv);
          div.appendChild(detailDiv);
          toolCallsList.appendChild(div);
        }

        toolModal.classList.add("visible");
      }

      async function sendCodingMessage() {
        const message = messageInput.value.trim();
        if ((!message && pendingImages.length === 0) || isLoading) return;

        if (!activeChatId) {
          await createNewChat();
        }

        const requestChatId = activeChatId;
        const imagesToSend = pendingImages.length > 0 ? [...pendingImages] : undefined;

        addMessage(message || "", "user", imagesToSend);
        messageInput.value = "";
        pendingImages = [];
        renderImagePreviews();
        updateChatTitle(requestChatId, message.length > 50 ? message.substring(0, 50) + "..." : message);

        isLoading = true;
        loadingChatId = requestChatId;
        syncComposerState();
        addLoadingMessage();

        try {
          const response = await fetch("/api/chat/tools", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: requestChatId, message, images: imagesToSend }),
          });

          const data = await response.json();
          if (activeChatId === requestChatId) {
            document.getElementById("loadingMessage")?.remove();
          }

          if (!response.ok) {
            if (activeChatId === requestChatId) {
              addMessage("Error: " + (data.error || "Unknown server error"), "assistant");
            }
          } else if (data.type === "text") {
            if (!chats.find(c => c.id === data.chat_id)) {
              await loadChats();
            }
            if (data.content && activeChatId === requestChatId) {
              addMessage(data.content, "assistant");
            }
          } else if (data.type === "tool_calls") {
            if (activeChatId === requestChatId) {
              showToolModal(data.tool_calls, requestChatId);
            } else {
              pendingToolCalls = data.tool_calls;
              pendingChatId = requestChatId;
            }
          }
        } catch (error) {
          console.error("Error:", error);
          if (activeChatId === requestChatId) {
            document.getElementById("loadingMessage")?.remove();
            addMessage("Sorry, there was an error processing your request.", "assistant");
          }
        } finally {
          isLoading = false;
          loadingChatId = null;
          syncComposerState();
          messageInput.focus();
        }
      }

      async function sendMessage() {
        await sendCodingMessage();
      }

      async function handleToolConfirm() {
        if (pendingToolCalls.length === 0 || pendingChatId !== activeChatId) return;
        const requestChatId = pendingChatId;

        toolModal.classList.remove("visible");
        isLoading = true;
        loadingChatId = requestChatId;
        syncComposerState();
        addLoadingMessage();

        try {
          const response = await fetch("/api/chat/tools/confirm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: requestChatId,
              approved: true,
            }),
          });

          const data = await response.json();
          if (activeChatId === requestChatId) {
            document.getElementById("loadingMessage")?.remove();
          }
          if (response.ok && pendingToolCalls.length > 0) {
            for (const tc of pendingToolCalls) {
              if (tc.function.name === "write_file" && tc.function.arguments && tc.function.arguments.path) {
                filesWrittenByTools.add(tc.function.arguments.path);
              }
            }
          }
          pendingToolCalls = [];
          pendingChatId = null;

          if (!response.ok) {
            if (activeChatId === requestChatId) {
              addMessage("Error: " + (data.error || "Unknown server error"), "assistant");
            }
          } else if (data.type === "text") {
            if (data.content && activeChatId === requestChatId) {
              addMessage(data.content, "assistant");
            }
          } else if (data.type === "tool_calls") {
            if (activeChatId === requestChatId) {
              showToolModal(data.tool_calls, requestChatId);
            } else {
              pendingToolCalls = data.tool_calls;
              pendingChatId = requestChatId;
            }
          }
        } catch (error) {
          console.error("Error:", error);
          if (activeChatId === requestChatId) {
            document.getElementById("loadingMessage")?.remove();
            addMessage("Sorry, there was an error processing your request.", "assistant");
          }
        } finally {
          isLoading = false;
          loadingChatId = null;
          syncComposerState();
          messageInput.focus();
        }
      }

      async function handleToolDeny() {
        if (pendingToolCalls.length === 0 || pendingChatId !== activeChatId) return;
        const requestChatId = pendingChatId;

        toolModal.classList.remove("visible");
        isLoading = true;
        loadingChatId = requestChatId;
        syncComposerState();
        addLoadingMessage();

        try {
          const response = await fetch("/api/chat/tools/confirm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: requestChatId, approved: false }),
          });

          const data = await response.json();
          if (activeChatId === requestChatId) {
            document.getElementById("loadingMessage")?.remove();
          }
          pendingToolCalls = [];
          pendingChatId = null;

          if (!response.ok) {
            if (activeChatId === requestChatId) {
              addMessage("Error: " + (data.error || "Unknown server error"), "assistant");
            }
          } else if (data.type === "text") {
            if (data.content && activeChatId === requestChatId) {
              addMessage(data.content, "assistant");
            }
          } else if (data.type === "tool_calls") {
            if (activeChatId === requestChatId) {
              showToolModal(data.tool_calls, requestChatId);
            } else {
              pendingToolCalls = data.tool_calls;
              pendingChatId = requestChatId;
            }
          }
        } catch (error) {
          console.error("Error:", error);
          if (activeChatId === requestChatId) {
            document.getElementById("loadingMessage")?.remove();
            addMessage("Sorry, there was an error processing your request.", "assistant");
          }
        } finally {
          isLoading = false;
          loadingChatId = null;
          syncComposerState();
          messageInput.focus();
        }
      }

      newChatBtn.addEventListener("click", createNewChat);
      sendButton.addEventListener("click", sendMessage);
      messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
      confirmBtn.addEventListener("click", handleToolConfirm);
      denyBtn.addEventListener("click", handleToolDeny);

      const workdirInput = document.getElementById("workdirInput");
      async function saveWorkdir() {
        if (!activeChatId) return;
        const value = workdirInput.value.trim();
        try {
          const res = await fetch("/api/chats/" + activeChatId + "/workdir", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ workdir: value || null }),
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            alert("Could not set folder: " + (data.error || res.status));
            return;
          }
          const chat = chats.find((c) => c.id === activeChatId);
          if (chat) chat.workdir = value || undefined;
          workdirInput.style.borderColor = "#22c55e";
          setTimeout(() => (workdirInput.style.borderColor = ""), 1200);
        } catch (e) {
          alert("Could not set folder: " + e.message);
        }
      }
      workdirInput.addEventListener("change", saveWorkdir);
      workdirInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") workdirInput.blur();
      });

      const attachBtn = document.getElementById("attachBtn");
      const imageFileInput = document.getElementById("imageFileInput");
      attachBtn.addEventListener("click", () => imageFileInput.click());
      imageFileInput.addEventListener("change", () => {
        for (const file of imageFileInput.files) {
          addPendingImageFromBlob(file);
        }
        imageFileInput.value = "";
      });

      messageInput.addEventListener("paste", (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (const item of items) {
          if (item.type.startsWith("image/")) {
            e.preventDefault();
            const blob = item.getAsFile();
            if (blob) addPendingImageFromBlob(blob);
          }
        }
      });

      chatContainer.addEventListener("dragover", (e) => {
        e.preventDefault();
        chatContainer.classList.add("drag-over");
      });
      chatContainer.addEventListener("dragleave", () => {
        chatContainer.classList.remove("drag-over");
      });
      chatContainer.addEventListener("drop", (e) => {
        e.preventDefault();
        chatContainer.classList.remove("drag-over");
        const files = e.dataTransfer?.files;
        if (!files) return;
        for (const file of files) {
          addPendingImageFromBlob(file);
        }
      });

      document.getElementById("toggleSidebar").addEventListener("click", () => {
        const sidebar = document.getElementById("sidebar");
        const btn = document.getElementById("toggleSidebar");
        sidebar.classList.toggle("collapsed");
        const isCollapsed = sidebar.classList.contains("collapsed");
        btn.textContent = isCollapsed ? "▶" : "◀";
        btn.title = isCollapsed ? "Expand sidebar" : "Collapse sidebar";
      });

      loadChats();
      connectChatEvents();
      messageInput.focus();
    </script>
  </body>
</html>
